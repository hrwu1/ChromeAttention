<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocked - Focus Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #520000 0%, #1c0000 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    p {
      font-size: 18px;
      margin-bottom: 32px;
      opacity: 0.9;
      line-height: 1.6;
    }

    .goal {
      background: rgba(255, 255, 255, 0.2);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 32px;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">🚫</div>
    <h1>Site Blocked</h1>
    <p>This site is on your blacklist and has been blocked to help you stay focused.</p>

    <div class="goal" id="blockedDomain">
      <strong>Blocked Domain:</strong> <span id="domainName">Loading...</span>
    </div>

    <div class="goal" id="goalDisplay" style="display: none;">
      <strong>Your Goal:</strong> <span id="goalText">Loading...</span>
    </div>

    <p style="margin-top: 24px; font-size: 14px; opacity: 0.8;">
      You can remove this domain from your blacklist in the extension settings.
    </p>
  </div>

  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const blockedUrl = urlParams.get('blocked');
    const domain = urlParams.get('domain');

    // Display blocked domain (just the domain name)
    if (domain) {
      document.getElementById('domainName').textContent = domain;
    }

    // Load and display current goal if there is one
    chrome.runtime.sendMessage({ type: 'GET_CURRENT_GOAL' }, (response) => {
      if (response && response.success && response.data) {
        document.getElementById('goalDisplay').style.display = 'block';
        document.getElementById('goalText').textContent = response.data.text;
      }
    });
  </script>
</body>

</html>
