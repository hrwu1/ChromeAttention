<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Blocked - Focus Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    p {
      font-size: 18px;
      margin-bottom: 32px;
      opacity: 0.9;
      line-height: 1.6;
    }

    .goal {
      background: rgba(255, 255, 255, 0.2);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 32px;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border: 2px solid white;
      background: transparent;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: white;
      color: #667eea;
      transform: translateY(-2px);
    }

    .btn-primary {
      background: white;
      color: #667eea;
    }

    .btn-primary:hover {
      background: rgba(255, 255, 255, 0.9);
    }

    .countdown {
      margin-top: 24px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🎯</div>
    <h1>Site Blocked</h1>
    <p>This site has been temporarily blocked to help you stay focused on your goal.</p>
    
    <div class="goal" id="goalDisplay">
      <strong>Your Goal:</strong> Loading...
    </div>

    <div class="buttons">
      <a href="javascript:history.back()" class="btn btn-primary">Go Back</a>
      <button class="btn" id="openSettingsBtn">Open Focus Assistant</button>
    </div>

    <div class="countdown" id="countdown"></div>
  </div>

  <script>
    // Load and display current goal
    chrome.runtime.sendMessage({ type: 'GET_CURRENT_GOAL' })
      .then(response => {
        if (response.success && response.data) {
          document.getElementById('goalDisplay').innerHTML = 
            `<strong>Your Goal:</strong> ${response.data.text}`;
        } else {
          document.getElementById('goalDisplay').textContent = 'No active goal';
        }
      })
      .catch(error => {
        console.error('Failed to load goal:', error);
      });

    // Open extension popup
    document.getElementById('openSettingsBtn').addEventListener('click', () => {
      chrome.runtime.openOptionsPage();
    });

    // Show countdown if there's a timer
    // This would need to be implemented with proper alarm tracking
  </script>
</body>
</html>
